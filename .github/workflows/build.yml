name: Build

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - 'blocks/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true
  TURBO_TELEMETRY_DISABLED: 1
  PLAYWRIGHT_BROWSERS_PATH: /ms-playwright

jobs:
  build:
    name: Build
    timeout-minutes: 15
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.59.0-jammy

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Fix Git Ownership
        run: git config --global --add safe.directory '*'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm run format:check

      - name: Lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      # The docs build regenerates the plugin's forge-design skill from the docs MDX. A diff here
      # means a docs change was committed without the skill it produces.
      - name: Check Forge Design Skill Is Up To Date
        run: |
          if ! git diff --exit-code --stat -- plugin/skills/forge-design || [ -n "$(git ls-files --others --exclude-standard -- plugin/skills/forge-design)" ]; then
            echo "::error::plugin/skills/forge-design is out of date. Run 'pnpm --filter forge-docs build:forge-skill' and commit the result."
            exit 1
          fi

      # Plugin users only receive changes when the plugin version changes, so any change to what
      # the plugin ships needs a changeset. Version-bump files are excluded so the release PR passes.
      - name: Check Plugin Changeset
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          changed=$(git diff --name-only "$BASE_REF"...HEAD -- plugin ':!plugin/package.json' ':!plugin/CHANGELOG.md' ':!plugin/tests/**')
          if [ -z "$changed" ]; then
            exit 0
          fi
          pnpm exec changeset status --since="$BASE_REF" --output=changeset-status.json > /dev/null
          if ! node -e "process.exit(require('./changeset-status.json').releases.some(r => r.name === '@tylertech/forge-plugin') ? 0 : 1)"; then
            echo "$changed"
            echo "::error::These plugin files changed without a @tylertech/forge-plugin changeset. Run 'pnpm changeset' and select @tylertech/forge-plugin so users receive the update."
            exit 1
          fi

      - name: Test
        run: pnpm run test
