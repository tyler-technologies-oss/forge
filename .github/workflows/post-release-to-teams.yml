name: Post Release to Teams

on:
  workflow_run:
    workflows: [Changesets]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to replay (e.g. @tylertech/forge@3.21.0)"
        required: true
        type: string
      webhook_url:
        description: "Override Teams webhook URL for testing (leave blank to use the TEAMS_WEBHOOK_URL secret)"
        required: false
        type: string

concurrency: 1

jobs:
  detect-releases:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      tags: ${{ steps.tags.outputs.tags }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-tags: true

      - id: tags
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ -n "$INPUT_TAG" ]]; then
            TAGS=$(jq -cn --arg t "$INPUT_TAG" '[$t]')
          else
            TAGS=$(git tag --points-at HEAD | grep '^@tylertech/' | jq -Rcs 'split("\n") | map(select(length > 0))')
          fi
          echo "Release tags: $TAGS"
          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

  notify:
    needs: detect-releases
    if: needs.detect-releases.outputs.tags != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    strategy:
      max-parallel: 1
      matrix:
        tag: ${{ fromJSON(needs.detect-releases.outputs.tags) }}
    steps:
      - name: Get release info
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.tag }}
        run: |
          RELEASE_JSON=$(gh api "repos/${{ github.repository }}/releases/tags/$TAG")
          echo "name=$(echo "$RELEASE_JSON" | jq -r '.name')" >> $GITHUB_OUTPUT
          echo "url=$(echo "$RELEASE_JSON" | jq -r '.html_url')" >> $GITHUB_OUTPUT
          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_JSON" | jq -r '.body' >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Build Teams message JSON
        id: message
        env:
          RELEASE_BODY: ${{ steps.release.outputs.body }}
        run: |
          SECTIONS=$(jq -n \
            --arg body "$RELEASE_BODY" \
            '[
              {
                text: $body
              }
            ]')

          # Save to output
          echo "sections<<EOF" >> $GITHUB_OUTPUT
          echo "$SECTIONS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Post to Microsoft Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ inputs.webhook_url || secrets.TEAMS_WEBHOOK_URL }}
          RELEASE_NAME: ${{ steps.release.outputs.name }}
          RELEASE_URL: ${{ steps.release.outputs.url }}
          REPO_URL: ${{ github.event.repository.html_url }}
          SECTIONS_JSON: ${{ steps.message.outputs.sections }}
        run: |
          PAYLOAD=$(jq -n \
            --arg name "$RELEASE_NAME" \
            --arg releaseUrl "$RELEASE_URL" \
            --arg repoUrl "$REPO_URL" \
            --argjson sections "$SECTIONS_JSON" \
            '{
              "@type": "MessageCard",
              "@context": "https://schema.org/extensions",
              summary: "New Release: \($name)",
              themeColor: "0078D7",
              title: "🚀 New Release: \($name)",
              sections: $sections,
              potentialAction: [
                {
                  "@type": "OpenUri",
                  name: "View Release",
                  targets: [{ os: "default", uri: $releaseUrl }]
                },
                {
                  "@type": "OpenUri",
                  name: "View Repository",
                  targets: [{ os: "default", uri: $repoUrl }]
                }
              ]
            }')

          curl -H 'Content-Type: application/json' -d "$PAYLOAD" "$TEAMS_WEBHOOK_URL"
 