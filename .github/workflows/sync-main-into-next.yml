name: Sync main into next

on:
  schedule:
    - cron: '0 14 * * 1'
  workflow_dispatch:

concurrency: ${{ github.workflow }}

permissions:
  contents: read

jobs:
  sync:
    name: Sync
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      # A PR opened with the default GITHUB_TOKEN does not trigger other workflows, so the required Build check would never report.
      - name: Generate GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.FORGE_AUTOBOT_ID }}
          private-key: ${{ secrets.FORGE_AUTOBOT_SECRET }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync main into next
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: .github/scripts/sync-main-into-next.sh
