name: Forge Skill

# The plugin's forge-design skill is generated from the docs site MDX, and users only receive it when
# the plugin version changes. This job checks both in about a minute and reports every problem at once,
# so a docs PR gets one clear message instead of waiting on the full build.
on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'docs/**'
      - 'plugin/**'
      - '.changeset/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: true

jobs:
  check:
    name: Forge Skill
    timeout-minutes: 10
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile --filter forge-docs --filter .

      - name: Check Forge Skill
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node docs/scripts/check-forge-skill.mjs
