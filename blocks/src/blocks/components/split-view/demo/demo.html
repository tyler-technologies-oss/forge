<!--
  @block Split View — Demo
  @type component
  @description Demo usage example for the forge-split-view component.
  @tags split-view, demo, storybook, component-example
-->
<forge-split-view auto-close-threshold="120" orientation="horizontal" class="h-[300px]">
  <forge-split-view-panel resizable="off" min="0" size="200" accessible-label="Split view panel" open="true" style="--forge-split-view-panel-size: 200px;" class="bg-[#e6e6fa]">
    <div class="flex items-center justify-center h-full">Panel 1</div>
  </forge-split-view-panel>
  <forge-split-view-panel size="200" resizable="start" min="0" accessible-label="Split view panel" open="true" style="--forge-split-view-panel-size: 200px;" class="bg-[#fa8070]">
    <div class="flex items-center justify-center h-full">Panel 2</div>
  </forge-split-view-panel>
</forge-split-view>
