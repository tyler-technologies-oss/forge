<!--
  @block Dialog — Demo
  @type component
  @description Demo usage example for the forge-dialog component.
  @tags dialog, demo, storybook, component-example
-->
<div>
  <forge-button id="open-dialog-button-demo" variant="raised">Open dialog</forge-button>
  <forge-dialog id="dialog-demo" label="Title text" description="Lorem ipsum dolor sit amet consectetur adipisicing elit.">
    <forge-scaffold class="h-auto [--forge-scaffold-width:500px]">
      <forge-toolbar slot="header" no-divider>
        <h2 class="forge-typography--heading4 m-0" slot="start">Title text</h2>
        <forge-icon-button id="close-dialog-icon-button-demo" slot="end" aria-label="Close dialog">
          <forge-icon name="close">
          </forge-icon>
        </forge-icon-button>
      </forge-toolbar>
      <p slot="body" class="p-medium">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugit sed pariatur error repellendus eos! Quas, optio esse ad illum quis blanditiis rerum quia.
        Corrupti, ad hic velit praesentium voluptatum dolores?
      </p>
      <forge-toolbar slot="footer" no-divider>
        <forge-button id="close-dialog-button-demo" slot="end" variant="raised">Close</forge-button>
      </forge-toolbar>
    </forge-scaffold>
  </forge-dialog>
</div>
