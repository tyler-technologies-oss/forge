<!--
  @block Dialog — Left Sheet
  @type component
  @description Left Sheet usage example for the forge-dialog component.
  @tags dialog, left-sheet, storybook, component-example
-->
<div>
  <forge-button id="open-dialog-button-left-sheet" variant="raised">Open dialog</forge-button>
  <forge-dialog id="dialog-left-sheet" preset="left-sheet">
    <forge-scaffold>
      <forge-toolbar slot="header" no-divider>
        <h1 class="forge-typography--heading4" id="dialog-title-left-sheet" slot="start">Title text</h1>
        <forge-icon-button id="close-dialog-icon-button-left-sheet" slot="end" aria-label="Close dialog">
          <forge-icon name="close">
          </forge-icon>
        </forge-icon-button>
      </forge-toolbar>
      <p slot="body" id="dialog-message-left-sheet">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugit sed pariatur error repellendus eos! Quas, optio esse ad illum quis blanditiis rerum quia.
        Corrupti, ad hic velit praesentium voluptatum dolores?
      </p>
      <forge-toolbar slot="footer" no-divider>
        <forge-button id="close-dialog-button-left-sheet" slot="end" variant="raised">Close</forge-button>
      </forge-toolbar>
    </forge-scaffold>
  </forge-dialog>
</div>
