<!--
  @block Dialog — Right Sheet
  @type component
  @description Right Sheet usage example for the forge-dialog component.
  @tags dialog, right-sheet, storybook, component-example
-->
<div>
  <forge-button id="open-dialog-button-right-sheet" variant="raised">Open dialog</forge-button>
  <forge-dialog id="dialog-right-sheet" label="Title text" description="Lorem ipsum dolor sit amet consectetur adipisicing elit." preset="right-sheet">
    <forge-scaffold class="h-auto [--forge-scaffold-width:500px]">
      <forge-toolbar slot="header">
        <h1 class="forge-typography--heading4 m-0" slot="start">Title text</h1>
        <forge-icon-button id="close-dialog-icon-button-right-sheet" slot="end" aria-label="Close dialog">
          <forge-icon name="close">
          </forge-icon>
        </forge-icon-button>
      </forge-toolbar>
      <p slot="body" class="p-medium">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugit sed pariatur error repellendus eos! Quas, optio esse ad illum quis blanditiis rerum quia.
        Corrupti, ad hic velit praesentium voluptatum dolores?
      </p>
      <forge-toolbar slot="footer" inverted>
        <forge-button id="close-dialog-button-right-sheet" slot="end" variant="raised">Close</forge-button>
      </forge-toolbar>
    </forge-scaffold>
  </forge-dialog>
</div>
