  @tags kbd, theme, storybook, component-example

<div class="flex flex-wrap items-center gap-medium">
  <forge-kbd theme="primary" shift keys="K"></forge-kbd>
  <forge-kbd theme="secondary" shift keys="K"></forge-kbd>
  <forge-kbd theme="tertiary" shift keys="K"></forge-kbd>
  <forge-kbd theme="info" shift keys="K"></forge-kbd>
  <forge-kbd theme="success" shift keys="K"></forge-kbd>
  <forge-kbd theme="warning" shift keys="K"></forge-kbd>
  <forge-kbd theme="error" shift keys="K"></forge-kbd>
</div>
