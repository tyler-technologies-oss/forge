<!--
  @block Radio — CSS Only
  @type component
  @description CSS Only usage example for the forge-radio component.
  @tags radio, css-only, storybook, component-example
-->
<div role="radiogroup" aria-label="Select an option" style="display: grid; grid-template-columns: auto auto; inline-size: fit-content; align-items: center;">
  <div class="forge-radio">
    <input type="radio" name="css-radio" id="css-radio-1">
  </div>
  <label class="forge-typography--label2" for="css-radio-1">Option 1</label>
  <div class="forge-radio">
    <input type="radio" name="css-radio" id="css-radio-2">
  </div>
  <label class="forge-typography--label2" for="css-radio-2">Option 2</label>
  <div class="forge-radio">
    <input type="radio" name="css-radio" id="css-radio-3">
  </div>
  <label class="forge-typography--label2" for="css-radio-3">Option 3</label>
</div>
