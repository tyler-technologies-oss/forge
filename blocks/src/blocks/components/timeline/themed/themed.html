<!--
  @block Timeline — Themed
  @type component
  @description Timeline items using each marker theme: primary, success, warning, error, and info.
  @tags timeline, themed, storybook, component-example
-->
<forge-timeline>
  <forge-timeline-item theme="primary">
    <span>Primary</span>
  </forge-timeline-item>
  <forge-timeline-item theme="success">
    <span>Success</span>
  </forge-timeline-item>
  <forge-timeline-item theme="warning">
    <span>Warning</span>
  </forge-timeline-item>
  <forge-timeline-item theme="error">
    <span>Error</span>
  </forge-timeline-item>
  <forge-timeline-item theme="info">
    <span>Info</span>
  </forge-timeline-item>
</forge-timeline>
