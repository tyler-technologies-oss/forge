<!--
  @block Timeline — Sidebar Options
  @type component
  @description Each sidebar value on a timeline item, from the automatic default to none, start, end, and both.
  @tags timeline, sidebar-options, storybook, component-example
-->
<forge-timeline>
  <forge-timeline-item>
    <span>Auto sidebars</span>
  </forge-timeline-item>
  <forge-timeline-item sidebar="none">
    <span>No sidebars</span>
  </forge-timeline-item>
  <forge-timeline-item sidebar="start">
    <span>Start sidebar</span>
  </forge-timeline-item>
  <forge-timeline-item sidebar="end">
    <span>End sidebar</span>
  </forge-timeline-item>
  <forge-timeline-item sidebar="both">
    <span>Both sidebars</span>
  </forge-timeline-item>
</forge-timeline>
