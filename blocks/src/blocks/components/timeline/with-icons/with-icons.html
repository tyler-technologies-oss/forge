<!--
  @block Timeline — With Icons
  @type component
  @description Timeline items with an icon in the marker slot in place of the default circular marker.
  @tags timeline, with-icons, storybook, component-example
-->
<forge-timeline>
  <forge-timeline-item>
    <forge-icon slot="marker" name="check_circle"></forge-icon>
    <span>Feature deployment completed successfully</span>
  </forge-timeline-item>
  <forge-timeline-item>
    <forge-icon slot="marker" name="schedule"></forge-icon>
    <span>Scheduled maintenance at 3:00 PM</span>
  </forge-timeline-item>
  <forge-timeline-item>
    <forge-icon slot="marker" name="star"></forge-icon>
    <span>Product launch</span>
  </forge-timeline-item>
</forge-timeline>
