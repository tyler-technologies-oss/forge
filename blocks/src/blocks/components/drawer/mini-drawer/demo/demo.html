<!--
  @block Mini Drawer — Demo
  @type component
  @description Demo usage example for the forge-mini-drawer component.
  @tags mini-drawer, demo, storybook, component-example
-->
<forge-scaffold style="--forge-scaffold-height: 300px">
  <forge-app-bar slot="header" title-text="Drawer Demo" elevation="raised">
    <forge-app-bar-menu-button slot="start" id="menu-button"></forge-app-bar-menu-button>
  </forge-app-bar>
  <forge-mini-drawer id="mini-drawer" slot="body-left" open direction="left">
    <aside>
      <forge-list navlist>
        <forge-list-item selected id="tooltip-host-1">
          <forge-tooltip anchor="tooltip-host-1" aria-hidden="true">Inbox</forge-tooltip>
          <forge-icon slot="start" name="inbox"> </forge-icon>
          <a href="javascript: void(0)">Inbox</a>
        </forge-list-item>
        <forge-list-item id="tooltip-host-2">
          <forge-tooltip anchor="tooltip-host-2" aria-hidden="true">Sent</forge-tooltip>
          <forge-icon slot="start" name="send"> </forge-icon>
          <a href="javascript: void(0)">Sent</a>
        </forge-list-item>
        <forge-list-item id="tooltip-host-3">
          <forge-tooltip anchor="tooltip-host-3" aria-hidden="true">Drafts</forge-tooltip>
          <forge-icon slot="start" name="drafts"> </forge-icon>
          <a href="javascript: void(0)">Drafts</a>
        </forge-list-item>
      </forge-list>
    </aside>
  </forge-mini-drawer>
  <main slot="body" style="padding: 16px; background-color: var(--forge-theme-surface-dim)">
    <forge-card>
      <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit sed do eiusmod tempor incididunt ut labore et dolore magna aliqua.</p>
    </forge-card>
  </main>
</forge-scaffold>
