<!--
  @block Count Card — With Menu
  @type component
  @description With Menu usage example for the forge-count-card component.
  @tags count-card, with-menu, storybook, component-example
-->
<div class="w-[320px]">
  <forge-count-card>
    <forge-icon slot="icon" name="attach_money"></forge-icon>
    <span slot="label">Revenue</span>
    <forge-menu slot="action">
      <forge-icon-button aria-label="More options">
        <forge-icon name="more_vert"></forge-icon>
      </forge-icon-button>
    </forge-menu>
    <span slot="count">$12,450.00</span>
  </forge-count-card>
</div>
