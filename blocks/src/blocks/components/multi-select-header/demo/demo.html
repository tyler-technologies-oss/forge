<!--
  @block Multi Select Header — Demo
  @type component
  @description Demo usage example for the forge-multi-select-header component.
  @tags multi-select-header, demo, storybook, component-example
-->
<forge-multi-select-header text="3 items selected">
  <span slot="select-all-button-text">Select All</span>
  <forge-icon-button slot="actions" aria-label="Select all items">
    <forge-icon name="download"></forge-icon>
  </forge-icon-button>
  <forge-icon-button slot="actions" aria-label="Clear selection">
    <forge-icon name="delete"></forge-icon>
  </forge-icon-button>
  <forge-menu slot="actions">
    <forge-icon-button aria-label="More actions">
      <forge-icon name="more_vert"></forge-icon>
    </forge-icon-button>
  </forge-menu>
</forge-multi-select-header>
