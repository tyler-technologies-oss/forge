<!--
  @block Listbox — Two Line
  @type component
  @description A listbox with options that display secondary text on a second line.
  @tags listbox, two-line, secondary-text, storybook, component-example
-->
<forge-listbox class="max-w-[500px]">
  <forge-option value="1" two-line>
    <span>Option 1</span>
    <span slot="secondary">Secondary text for option 1</span>
  </forge-option>
  <forge-option value="2" two-line>
    <span>Option 2</span>
    <span slot="secondary">Secondary text for option 2</span>
  </forge-option>
  <forge-option value="3" two-line>
    <span>Option 3</span>
    <span slot="secondary">Secondary text for option 3</span>
  </forge-option>
</forge-listbox>
