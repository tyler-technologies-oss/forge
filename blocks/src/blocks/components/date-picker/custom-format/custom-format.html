<!--
  @block Date Picker — Custom Format
  @type component
  @description Custom Format usage example for the forge-date-picker component.
  @tags date-picker, custom-format, storybook, component-example
-->
<forge-date-picker mask-format="Mmm DD, YYYY" shortcuts="off">
  <forge-text-field>
    <label for="date-picker" slot="label">Date</label>
    <input type="text" id="date-picker" autocomplete="off" placeholder="Mmm DD, YYYY" autocorrect="off" autocapitalize="off" spellcheck="false" role="combobox" aria-live="assertive" aria-atomic="true" aria-haspopup="true" aria-expanded="false" aria-owns="forge-date-picker-q1x73" aria-controls="forge-aria-controls-placeholder" aria-disabled="false">
    <span slot="support-text">Enter a date in the format Mmm DD, YYYY (e.g., Jul 08, 2025)</span>
    <forge-icon-button aria-label="Toggle calendar" slot="end" density="medium">
      <forge-icon name="insert_invitation">
      </forge-icon>
    </forge-icon-button>
  </forge-text-field>
</forge-date-picker>
