  @block Stepper — Demo
  @type component
  @description Demo usage example for the forge-stepper component.
  @tags stepper, demo, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1145/" />
    <title>Stepper — Demo</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1145/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1145/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1145/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-stepper>
  <forge-step index="0" clustered first selected>Step 1</forge-step>
  <forge-step index="1" clustered>
    Step 2
    <span slot="optional">Optional</span>
  </forge-step>
  <forge-step index="2" clustered>
    <div slot="expansion-content">Expansion Content</div>
    Step 3
  </forge-step>
  <forge-step index="3" clustered last>Step 4</forge-step>
</forge-stepper>
  </body>
</html>
