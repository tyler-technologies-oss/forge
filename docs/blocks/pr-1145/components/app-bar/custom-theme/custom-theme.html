<!--
  @block App Bar — Custom Theme
  @type component
  @description Custom Theme usage example for the forge-app-bar component.
  @tags app-bar, custom-theme, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1145/" />
    <title>App Bar — Custom Theme</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/styles.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/components/app-bar/custom-theme/custom-theme.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1145/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1145/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1145/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-app-bar class="custom-app-bar" title-text="Tyler Forge™" theme-mode="scoped" elevation="raised">
  <forge-icon slot="logo" name="forge_logo">
  </forge-icon>
  <forge-button slot="end" theme="app-bar">Sign In</forge-button>
</forge-app-bar>
<script type="module" src="/blocks/pr-1145/components/app-bar/custom-theme/custom-theme.js"></script>
  </body>
</html>
