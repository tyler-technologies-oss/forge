<!--
  @block Chip Field — With Autocomplete
  @type component
  @description With Autocomplete usage example for the forge-chip-field component.
  @tags chip-field, with-autocomplete, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1145/" />
    <title>Chip Field — With Autocomplete</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1145/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1145/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1145/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-autocomplete mode="stateless">
  <forge-chip-field popover-icon show-clear>
    <label slot="label" for="tag-input">Tags</label>
    <input type="text" id="tag-input" autocomplete="off" role="combobox" aria-live="polite" aria-atomic="true" aria-haspopup="true" aria-expanded="false" aria-autocomplete="list" aria-controls="forge-aria-controls-placeholder">
  </forge-chip-field>
</forge-autocomplete>
<script type="module" src="/blocks/pr-1145/components/chip-field/with-autocomplete/with-autocomplete.js"></script>
  </body>
</html>
