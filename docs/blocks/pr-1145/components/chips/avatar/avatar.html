  @type component
  @description Avatar usage example for the forge-chips component.

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1145/" />
    <title>Chips — Avatar</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1145/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1145/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1145/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-chip-set>
  <forge-chip value="ruby">
    <forge-avatar size="small" image-url="./ruby-side.jpg" slot="start">
    </forge-avatar>
    Ruby
  </forge-chip>
  <forge-chip value="leo">
    <forge-avatar size="small" image-url="./leo.png" slot="start">
    </forge-avatar>
    Leo
  </forge-chip>
  <forge-chip value="harley">
    <forge-avatar size="small" image-url="./harley.jpg" slot="start">
    </forge-avatar>
    Harley
  </forge-chip>
</forge-chip-set>
  </body>
</html>
