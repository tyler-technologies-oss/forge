<!--
  @block Icon Button — Toggle
  @type component
  @description Toggle usage example for the forge-icon-button component.
  @tags icon-button, toggle, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1145/" />
    <title>Icon Button — Toggle</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1145/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1145/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1145/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-icon-button toggle aria-label="Default toggle icon button">
  <forge-icon name="favorite_border">
  </forge-icon>
  <forge-icon slot="on" name="favorite">
  </forge-icon>
</forge-icon-button>
<forge-icon-button toggle variant="outlined" aria-label="Outlined toggle icon button">
  <forge-icon name="favorite_border">
  </forge-icon>
  <forge-icon slot="on" name="favorite">
  </forge-icon>
</forge-icon-button>
<forge-icon-button toggle variant="tonal" aria-label="Tonal toggle icon button">
  <forge-icon name="favorite_border">
  </forge-icon>
  <forge-icon slot="on" name="favorite">
  </forge-icon>
</forge-icon-button>
<forge-icon-button toggle variant="filled" aria-label="Filled toggle icon button">
  <forge-icon name="favorite_border">
  </forge-icon>
  <forge-icon slot="on" name="favorite">
  </forge-icon>
</forge-icon-button>
<forge-icon-button toggle variant="raised" aria-label="Raised toggle icon button">
  <forge-icon name="favorite_border">
  </forge-icon>
  <forge-icon slot="on" name="favorite">
  </forge-icon>
</forge-icon-button>
<script type="module" src="/blocks/pr-1145/components/icon-button/toggle/toggle.js"></script>
  </body>
</html>
