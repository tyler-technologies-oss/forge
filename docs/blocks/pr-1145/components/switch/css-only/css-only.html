<!--
  @block Switch — CSS Only
  @type component
  @description CSS Only usage example for the forge-switch component.
  @tags switch, css-only, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1145/" />
    <title>Switch — CSS Only</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/styles.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/components/switch/css-only/css-only.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1145/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1145/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1145/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <label class="forge-typography--label2" style="display: flex; align-items: center;">
  <div class="forge-switch">
    <input type="checkbox" switch>
    <div class="forge-switch__thumb">
      <forge-icon name="close" class="forge-switch__icon forge-switch__icon--off">
      </forge-icon>
      <forge-icon name="check" class="forge-switch__icon forge-switch__icon--on">
      </forge-icon>
    </div>
  </div>
  <span>Toggle me</span>
</label>
<script type="module" src="/blocks/pr-1145/components/switch/css-only/css-only.js"></script>
  </body>
</html>
