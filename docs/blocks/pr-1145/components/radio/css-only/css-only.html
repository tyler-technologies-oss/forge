<!--
  @block Radio — CSS Only
  @type component
  @description CSS Only usage example for the forge-radio component.
  @tags radio, css-only, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1145/" />
    <title>Radio — CSS Only</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/styles.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/components/radio/css-only/css-only.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1145/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1145/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1145/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div role="radiogroup" aria-label="Select an option" style="display: grid; grid-template-columns: auto auto; inline-size: fit-content; align-items: center;">
  <div class="forge-radio">
    <input type="radio" name="css-radio" id="css-radio-1">
  </div>
  <label class="forge-typography--label2" for="css-radio-1">Option 1</label>
  <div class="forge-radio">
    <input type="radio" name="css-radio" id="css-radio-2">
  </div>
  <label class="forge-typography--label2" for="css-radio-2">Option 2</label>
  <div class="forge-radio">
    <input type="radio" name="css-radio" id="css-radio-3">
  </div>
  <label class="forge-typography--label2" for="css-radio-3">Option 3</label>
</div>
  </body>
</html>
