<!--
  @block Popover — Non Modal
  @type component
  @description Non Modal usage example for the forge-popover component.
  @tags popover, non-modal, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1145/" />
    <title>Popover — Non Modal</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1145/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1145/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1145/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1145/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-button id="popover-trigger-nonmodal" variant="raised">Show Non-modal Popover</forge-button>
<forge-popover anchor="popover-trigger-nonmodal" placement="bottom-start" arrow aria-modal="false" aria-labelledby="nonmodal-title">
  <forge-scaffold>
    <forge-toolbar no-border slot="header">
      <h2 class="forge-typography--heading4" slot="start" id="nonmodal-title">Enter Your Name</h2>
    </forge-toolbar>
    <div slot="body" id="nonmodal-description" style="width: 300px; padding: var(--forge-spacing-medium);">
      <form autocomplete="off">
        <forge-text-field>
          <input autofocus type="text" name="your-name" value required aria-label="Enter your name">
        </forge-text-field>
      </form>
    </div>
    <forge-toolbar no-border slot="footer">
      <forge-button slot="end" style="margin-right: var(--forge-spacing-medium);">Cancel</forge-button>
      <forge-button slot="end" variant="filled" disabled>Save</forge-button>
    </forge-toolbar>
  </forge-scaffold>
</forge-popover>
<script type="module" src="/blocks/pr-1145/components/popover/non-modal/non-modal.js"></script>
  </body>
</html>
