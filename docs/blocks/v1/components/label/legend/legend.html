<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-radio-group class="align" aria-label="Choose an option">
  <forge-label legend non-interactive>Choose an option</forge-label>
  <forge-radio name="default">Option 1</forge-radio>
  <forge-radio name="default">Option 2</forge-radio>
  <forge-radio name="default">Option 3</forge-radio>
</forge-radio-group>
