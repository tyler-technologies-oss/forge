<!--
  @block App Launcher — Lazy Loading
  @type component
  @description Loads the app launcher's apps from an API the first time it opens, using the toggle event.
  @tags app-launcher, lazy-loading, async, api, toggle, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>App Launcher — Lazy Loading</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-app-bar theme-mode="scoped" title-text="App Launcher">
  <forge-app-launcher slot="end" search-placeholder="Search by product or app"></forge-app-launcher>
</forge-app-bar>
<script type="module" src="/blocks/v1/components/app-launcher/lazy-loading/lazy-loading.js"></script>
  </body>
</html>
