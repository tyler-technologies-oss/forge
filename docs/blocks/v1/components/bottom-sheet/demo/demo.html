<!--
  @block Bottom Sheet — Demo
  @type component
  @description Demo usage example for the forge-bottom-sheet component.
  @tags bottom-sheet, demo, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Bottom Sheet — Demo</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <link rel="stylesheet" href="/blocks/v1/components/bottom-sheet/demo/demo.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-button variant="raised">Show Bottom Sheet</forge-button>
<forge-bottom-sheet aria-labelledby="title" aria-describedby="message" mode="modal" aria-modal="true">
  <div class="content">
    <h2 id="title">Bottom Sheet Title</h2>
    <p id="message">Lorem ipsum dolor sit amet, consectetur adipiscing elit. Suspendisse nec urna et felis.</p>
  </div>
  <forge-toolbar>
    <forge-button slot="end">Close</forge-button>
  </forge-toolbar>
</forge-bottom-sheet>
  </body>
</html>
