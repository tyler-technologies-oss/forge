<!--
  @block Structured Card — Multiple Cards
  @type component
  @description Multiple Cards usage example for the forge-structured-card component.
  @tags structured-card, multiple-cards, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Structured Card — Multiple Cards</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div class="flex flex-wrap gap-large">
  <forge-structured-card heading-level="2" class="grow basis-[300px] max-w-[400px]">
    <div slot="title" class="flex items-center gap-medium">
      <forge-icon name="person"></forge-icon>
      <span>User Profile</span>
    </div>
    <forge-badge theme="success" slot="header-actions">
      <forge-icon name="check_circle" slot="start"></forge-icon>
      <span>Active</span>
    </forge-badge>
    <div slot="body" class="flex flex-col gap-small">
      <div class="bg-surface-dim rounded-sm h-[48px]"></div>
      <div class="bg-surface-dim rounded-sm h-[24px]"></div>
      <div class="bg-surface-dim rounded-sm h-[24px] w-[60%]"></div>
    </div>
    <forge-button variant="text" slot="footer-secondary-action">Cancel</forge-button>
    <forge-button variant="tonal" slot="footer-primary-action">Save</forge-button>
  </forge-structured-card>

  <forge-structured-card heading-level="2" class="grow basis-[300px] max-w-[400px]">
    <div slot="title" class="flex items-center gap-medium">
      <forge-icon name="settings"></forge-icon>
      <span>Preferences</span>
    </div>
    <forge-badge theme="warning" slot="header-actions">
      <forge-icon name="construction" slot="start"></forge-icon>
      <span>Modified</span>
    </forge-badge>
    <div slot="body" class="flex flex-col gap-small">
      <div class="bg-surface-dim rounded-sm h-[24px]"></div>
      <div class="bg-surface-dim rounded-sm h-[24px]"></div>
      <div class="bg-surface-dim rounded-sm h-[48px]"></div>
    </div>
    <forge-button variant="text" slot="footer-secondary-action">Reset</forge-button>
    <forge-button variant="tonal" slot="footer-primary-action">Apply</forge-button>
  </forge-structured-card>

  <forge-structured-card heading-level="2" class="grow basis-[300px] max-w-[400px]">
    <div slot="title" class="flex items-center gap-medium">
      <forge-icon name="edit"></forge-icon>
      <span>Notes</span>
    </div>
    <forge-badge theme="info-secondary" slot="header-actions">
      <forge-icon name="description" slot="start"></forge-icon>
      <span>Draft</span>
    </forge-badge>
    <div slot="body" class="flex flex-col gap-small">
      <div class="bg-surface-dim rounded-sm h-[24px] w-[60%]"></div>
      <div class="bg-surface-dim rounded-sm h-[48px]"></div>
      <div class="bg-surface-dim rounded-sm h-[24px]"></div>
      <div class="bg-surface-dim rounded-sm h-[24px] w-[60%]"></div>
    </div>
    <forge-button variant="text" slot="footer-secondary-action">Discard</forge-button>
    <forge-button variant="tonal" slot="footer-primary-action">Save</forge-button>
  </forge-structured-card>
</div>
<script type="module" src="/blocks/v1/components/structured-card/multiple-cards/multiple-cards.js"></script>
  </body>
</html>
