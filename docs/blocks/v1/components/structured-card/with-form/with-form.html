<!--
  @block Structured Card — With Form
  @type component
  @description With Form usage example for the forge-structured-card component.
  @tags structured-card, with-form, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Structured Card — With Form</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div class="w-[600px]">
  <forge-structured-card heading-level="2">
    <div slot="title">Project Details</div>

    <forge-badge theme="warning" slot="header-actions">
      <span>In progress</span>
      <forge-icon name="construction" slot="end"></forge-icon>
    </forge-badge>
    <form slot="body">
      <forge-stack>
        <forge-text-field label-position="block-start">
          <label>Project name</label>
          <input type="text" />
        </forge-text-field>
        <forge-text-field label-position="block-start">
          <label>Description</label>
          <textarea></textarea>
        </forge-text-field>
        <forge-select label="Category" label-position="block-start">
          <forge-option value="development">Development</forge-option>
          <forge-option value="design">Design</forge-option>
          <forge-option value="marketing">Marketing</forge-option>
          <forge-option value="research">Research</forge-option>
        </forge-select>
        <forge-text-field label-position="block-start">
          <label>Owner</label>
          <input type="text" />
        </forge-text-field>
        <forge-file-picker accept=".jpg,.png,.pdf">
          <forge-button variant="outlined">Attach files</forge-button>
        </forge-file-picker>
      </forge-stack>
    </form>
    <forge-button variant="text" slot="footer-secondary-action">
      <forge-icon slot="start" name="delete"></forge-icon>
      Cancel
    </forge-button>
    <forge-button variant="tonal" slot="footer-primary-action">
      <forge-icon slot="start" name="save"></forge-icon>
      Save
    </forge-button>
  </forge-structured-card>
</div>
<script type="module" src="/blocks/v1/components/structured-card/with-form/with-form.js"></script>
  </body>
</html>
