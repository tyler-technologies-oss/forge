<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Expansion Panel — With Unslotted Button</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <button id="button-id" aria-expanded="false" aria-controls="forge-expansion-panel-content-t63ev">Toggle</button>
<forge-card>
  <forge-expansion-panel trigger="button-id" orientation="vertical" animation-type="default" open-icon name>
    <div slot="header" role="button" tabindex="0" style="display: flex; justify-content: space-between;">
      <div>Header text</div>
      <forge-open-icon orientation="vertical" rotation="full"></forge-open-icon>
    </div>
    <p id="forge-expansion-panel-content-t63ev">Content text</p>
  </forge-expansion-panel>
</forge-card>
  </body>
</html>
