<!--
  @block Kbd — Key Strings
  @type component
  @description Kbd rendering arrow keys and named keys with their glyphs or friendly names.
  @tags kbd, key-strings, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Kbd — Key Strings</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
    <script type="module" src="/blocks/v1/link-guard.js" id="link-guard"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div class="flex flex-wrap items-center gap-medium">
  <forge-kbd keys="ArrowUp"></forge-kbd>
  <forge-kbd keys="ArrowDown"></forge-kbd>
  <forge-kbd keys="ArrowLeft"></forge-kbd>
  <forge-kbd keys="ArrowRight"></forge-kbd>
  <forge-kbd keys="Enter"></forge-kbd>
  <forge-kbd keys="Escape"></forge-kbd>
  <forge-kbd keys="PageDown"></forge-kbd>
</div>
  </body>
</html>
