<!--
  @block Time Picker — Demo
  @type component
  @description Demo usage example for the forge-time-picker component.
  @tags time-picker, demo, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Time Picker — Demo</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-time-picker use-24-hour-time="false" allow-invalid-time="false">
  <forge-text-field>
    <input id="time-picker" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" role="combobox" aria-live="assertive" aria-atomic="true" aria-haspopup="true" aria-expanded="false" aria-controls="forge-aria-controls-placeholder" aria-disabled="false">
    <label for="time-picker" slot="label">Time</label>
    <forge-icon-button slot="trailing" density="medium" aria-label="Toggle time dropdown">
      <forge-icon name="clock_outline">
      </forge-icon>
    </forge-icon-button>
  </forge-text-field>
</forge-time-picker>
<script type="module" src="/blocks/v1/components/time-picker/demo/demo.js"></script>
  </body>
</html>
