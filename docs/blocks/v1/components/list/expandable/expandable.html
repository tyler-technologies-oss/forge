<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>List — Expandable</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <link rel="stylesheet" href="/blocks/v1/components/list/expandable/expandable.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-list>
  <forge-list-item>
    <forge-icon slot="start" name="code">
    </forge-icon>
    <button type="button" id="li-1" aria-expanded="false" aria-controls="forge-expansion-panel-content-r5qaz">List Item One</button>
    <forge-open-icon slot="end" id="li-open-1" orientation="vertical" rotation="full"></forge-open-icon>
    <forge-expansion-panel slot="additional-content" trigger="li-1" open-icon="li-open-1" orientation="vertical" animation-type="default" name>
      <forge-list indented id="forge-expansion-panel-content-r5qaz">
        <forge-list-item indented>
          <button type="button">List Item One</button>
        </forge-list-item>
        <forge-list-item indented>
          <button type="button">List Item Two</button>
        </forge-list-item>
        <forge-list-item indented>
          <button type="button">List Item Three</button>
        </forge-list-item>
      </forge-list>
    </forge-expansion-panel>
  </forge-list-item>
  <forge-list-item>
    <forge-icon slot="start" name="face">
    </forge-icon>
    <button type="button" id="li-2" aria-expanded="false" aria-controls="forge-expansion-panel-content-ohr7t">List Item Two</button>
    <forge-open-icon slot="end" id="li-open-2" orientation="vertical" rotation="full"></forge-open-icon>
    <forge-expansion-panel slot="additional-content" trigger="li-2" open-icon="li-open-2" orientation="vertical" animation-type="default" name>
      <forge-list indented id="forge-expansion-panel-content-ohr7t">
        <forge-list-item indented>
          <button type="button">List Item One</button>
        </forge-list-item>
        <forge-list-item indented>
          <button type="button">List Item Two</button>
        </forge-list-item>
        <forge-list-item indented>
          <button type="button">List Item Three</button>
        </forge-list-item>
      </forge-list>
    </forge-expansion-panel>
  </forge-list-item>
  <forge-list-item>
    <forge-icon slot="start" name="favorite">
    </forge-icon>
    <button type="button">List Item Three</button>
  </forge-list-item>
</forge-list>
<script type="module" src="/blocks/v1/components/list/expandable/expandable.js"></script>
  </body>
</html>
