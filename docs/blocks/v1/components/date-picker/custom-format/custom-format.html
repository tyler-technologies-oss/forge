<!--
  @block Date Picker — Custom Format
  @type component
  @description Custom Format usage example for the forge-date-picker component.
  @tags date-picker, custom-format, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Date Picker — Custom Format</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-date-picker mask-format="Mmm DD, YYYY" shortcuts="off">
  <forge-text-field>
    <label for="date-picker" slot="label">Date</label>
    <input type="text" id="date-picker" autocomplete="off" placeholder="Mmm DD, YYYY" autocorrect="off" autocapitalize="off" spellcheck="false" role="combobox" aria-live="assertive" aria-atomic="true" aria-haspopup="true" aria-expanded="false" aria-owns="forge-date-picker-q1x73" aria-controls="forge-aria-controls-placeholder" aria-disabled="false">
    <span slot="support-text">Enter a date in the format Mmm DD, YYYY (e.g., Jul 08, 2025)</span>
    <forge-icon-button aria-label="Toggle calendar" slot="end" density="medium">
      <forge-icon name="insert_invitation">
      </forge-icon>
    </forge-icon-button>
  </forge-text-field>
</forge-date-picker>
<script type="module" src="/blocks/v1/components/date-picker/custom-format/custom-format.js"></script>
  </body>
</html>
