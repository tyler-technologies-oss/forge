<!--
  @block Confirmation Dialog — Demo
  @type component
  @description Demo usage example for the forge-confirmation-dialog component.
  @tags confirmation-dialog, demo, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Confirmation Dialog — Demo</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div>
  <forge-button variant="raised">Show Confirmation Dialog</forge-button>
  <forge-confirmation-dialog>
    <span slot="title">Delete selected images?</span>
    <span slot="message">Images will be permanently removed from your account and all synced devices.</span>
    <span slot="secondary-button-text">No</span>
    <span slot="primary-button-text">Yes</span>
  </forge-confirmation-dialog>
</div>
<script type="module" src="/blocks/v1/components/confirmation-dialog/demo/demo.js"></script>
  </body>
</html>
