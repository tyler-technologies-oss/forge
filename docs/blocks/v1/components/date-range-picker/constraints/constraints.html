<!--
  @block Date Range Picker — Constraints
  @type component
  @description Constraints usage example for the forge-date-range-picker component.
  @tags date-range-picker, constraints, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Date Range Picker — Constraints</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-date-range-picker min="01/01/2026" max="12/31/2026">
  <forge-text-field>
    <label for="date-range-min-01">Project span</label>
    <input type="text" id="date-range-min-01" autocomplete="off" placeholder="mm/dd/yyyy" />
    <input type="text" id="date-range-min-02" autocomplete="off" placeholder="mm/dd/yyyy" />
  </forge-text-field>
</forge-date-range-picker>
  </body>
</html>
