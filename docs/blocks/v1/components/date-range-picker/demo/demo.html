<!--
  @block Date Range Picker — Demo
  @type component
  @description Demo usage example for the forge-date-range-picker component.
  @tags date-range-picker, demo, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Date Range Picker — Demo</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-date-range-picker style="width: 263px">
  <forge-text-field>
    <label for="input-date-range-picker-01" slot="label">Date</label>
    <input type="text" id="input-date-range-picker-01" autocomplete="off" placeholder="mm/dd/yyyy" autocorrect="off" autocapitalize="off" spellcheck="false" role="combobox" aria-live="assertive" aria-atomic="true" aria-haspopup="true" aria-expanded="false" aria-owns="forge-date-range-picker-v7zqn" aria-controls="forge-aria-controls-placeholder" aria-disabled="false">
    <span data-forge-multi-input-separator aria-hidden="true">-</span>
    <input type="text" id="input-date-range-picker-02" autocomplete="off" placeholder="mm/dd/yyyy" autocorrect="off" autocapitalize="off" spellcheck="false" role="combobox" aria-live="assertive" aria-atomic="true" aria-haspopup="true" aria-expanded="false" aria-owns="forge-date-range-picker-v7zqn" aria-label="To date" aria-controls="forge-aria-controls-placeholder" aria-disabled="false">
    <forge-icon-button aria-label="Toggle calendar" slot="end" density="medium">
      <forge-icon name="date_range">
      </forge-icon>
    </forge-icon-button>
  </forge-text-field>
</forge-date-range-picker>
<script type="module" src="/blocks/v1/components/date-range-picker/demo/demo.js"></script>
  </body>
</html>
