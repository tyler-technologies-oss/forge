<!--
  @block Process Stepper — Horizontal
  @type component
  @description Horizontal process stepper showing progress through a checkout flow.
  @tags process-stepper, horizontal, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Process Stepper — Horizontal</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-process-stepper orientation="horizontal">
  <forge-process-step state="completed">1. Cart</forge-process-step>
  <forge-process-step state="current">2. Shipping</forge-process-step>
  <forge-process-step>3. Payment</forge-process-step>
  <forge-process-step>4. Review</forge-process-step>
</forge-process-stepper>
  </body>
</html>
