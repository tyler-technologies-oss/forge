<!--
  @block Process Stepper — Demo
  @type component
  @description Vertical process stepper tracking a record through completed, current, and upcoming steps.
  @tags process-stepper, demo, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Process Stepper — Demo</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-process-stepper>
  <forge-process-step state="completed">Application received</forge-process-step>
  <forge-process-step state="completed">Fees paid</forge-process-step>
  <forge-process-step state="current">Internal review</forge-process-step>
  <forge-process-step state="not-started">Documents approved</forge-process-step>
  <forge-process-step state="not-started">Record issued</forge-process-step>
</forge-process-stepper>
  </body>
</html>
