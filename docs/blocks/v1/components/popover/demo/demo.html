<!--
  @block Popover — Demo
  @type component
  @description Demo usage example for the forge-popover component.
  @tags popover, demo, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Popover — Demo</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-button id="popover-trigger" variant="raised">Show Popover</forge-button>
<forge-popover anchor="popover-trigger" placement="bottom" position-strategy="fixed" shift="false" hide="anchor-hidden">
  <forge-scaffold>
    <forge-toolbar no-border slot="header">
      <h2 class="forge-typography--heading4" slot="start">Popover Title</h2>
    </forge-toolbar>
    <div slot="body" style="width: 300px; padding: var(--forge-spacing-medium);">Popover content</div>
    <forge-toolbar no-border slot="footer">
      <forge-button slot="end" variant="filled">Close</forge-button>
    </forge-toolbar>
  </forge-scaffold>
</forge-popover>
  </body>
</html>
