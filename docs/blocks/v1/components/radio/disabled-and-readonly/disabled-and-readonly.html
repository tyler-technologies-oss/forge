<!--
  @block Radio — Disabled And Readonly
  @type component
  @description Disabled And Readonly usage example for the forge-radio component.
  @tags radio, disabled-and-readonly, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Radio — Disabled And Readonly</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div role="radiogroup" aria-label="Disabled example">
  <forge-radio name="disabled-demo" disabled>Option 1</forge-radio>
  <forge-radio name="disabled-demo" disabled>Option 2</forge-radio>
</div>
<div role="radiogroup" aria-label="Read-only example">
  <forge-radio name="readonly-demo" readonly checked>Option 1</forge-radio>
  <forge-radio name="readonly-demo" readonly>Option 2</forge-radio>
</div>
  </body>
</html>
