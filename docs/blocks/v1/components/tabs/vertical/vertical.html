<!--
  @block Tabs — Vertical
  @type component
  @description Vertical usage example for the forge-tabs component.
  @tags tabs, vertical, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Tabs — Vertical</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div class="flex gap-medium">
  <forge-tab-bar data-aria-label="Demo tabs" active-tab="0" vertical style="max-width:200px;" aria-orientation="vertical">
    <forge-tab id="vertical-tab-1" selected vertical>
      Tab 1
    </forge-tab>
    <forge-tab id="vertical-tab-2" vertical>
      Tab 2
    </forge-tab>
    <forge-tab id="vertical-tab-3" vertical>
      Tab 3
    </forge-tab>
  </forge-tab-bar>

  <div class="flex-1">
    <forge-tab-panel for="vertical-tab-1">
      <div class="p-medium">Tab 1 content</div>
    </forge-tab-panel>
    <forge-tab-panel for="vertical-tab-2">
      <div class="p-medium">Tab 2 content</div>
    </forge-tab-panel>
    <forge-tab-panel for="vertical-tab-3">
      <div class="p-medium">Tab 3 content</div>
    </forge-tab-panel>
  </div>
</div>
  </body>
</html>
