  @description Demo usage example for the forge-help-button component.

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Help Button — Demo</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-app-bar title-text="Help Icon" elevation="raised">
  <forge-app-bar-help-button slot="end">
    <forge-menu placement="bottom-end">
      <forge-icon-button theme="app-bar" aria-atomic="true" aria-live="assertive" aria-haspopup="true" aria-labelledby="forge-tooltip-746pm">
        <forge-icon name="help">
        </forge-icon>
      </forge-icon-button>
      <forge-tooltip type="label" placement="bottom" aria-hidden="true" id="forge-tooltip-746pm">Help</forge-tooltip>
    </forge-menu>
  </forge-app-bar-help-button>
</forge-app-bar>
<script type="module" src="/blocks/v1/components/app-bar/help-button/demo/demo.js"></script>
  </body>
</html>
