<!--
  @block App Bar — White Theme
  @type component
  @description White Theme usage example for the forge-app-bar component.
  @tags app-bar, white-theme, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>App Bar — White Theme</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-app-bar theme-mode="scoped" title-text="Tyler Forge" elevation="raised" theme="white">
  <forge-icon slot="logo" name="forge_logo">
  </forge-icon>
</forge-app-bar>
<script type="module" src="/blocks/v1/components/app-bar/white-theme/white-theme.js"></script>
  </body>
</html>
