<!--
  @block App Bar — Full
  @type component
  @description Full usage example for the forge-app-bar component.
  @tags app-bar, full, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>App Bar — Full</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-app-bar title-text="Tyler Forge™" theme-mode="scoped" elevation="raised">
  <forge-app-bar-menu-button slot="start"></forge-app-bar-menu-button>
  <forge-icon slot="logo" name="forge_logo">
  </forge-icon>
  <forge-app-bar-search slot="center">
    <input type="text" placeholder="Search">
  </forge-app-bar-search>
  <forge-app-bar-help-button slot="end"></forge-app-bar-help-button>
  <forge-app-bar-notification-button slot="end"></forge-app-bar-notification-button>
  <forge-user-profile slot="end" button-label="Open profile menu" theme-toggle full-name="First Last" email="first.last@tylertech.com">
    <forge-profile-link slot="link">
      <forge-icon slot="icon" name="settings"></forge-icon>
      <a href="#">Settings</a>
    </forge-profile-link>
    <forge-profile-link slot="link">
      <forge-icon slot="icon" name="account_circle"></forge-icon>
      <a href="#">Profile</a>
    </forge-profile-link>
    <span slot="sign-out-button-text">Sign Out</span>
  </forge-user-profile>
</forge-app-bar>
<script type="module" src="/blocks/v1/components/app-bar/full/full.js"></script>
  </body>
</html>
