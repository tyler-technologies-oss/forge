<!--
  @block Split View — Vertical
  @type component
  @description Vertical usage example for the forge-split-view component.
  @tags split-view, vertical, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Split View — Vertical</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-split-view orientation="vertical" class="h-64">
  <forge-split-view-panel size="150" accessible-label="Top panel">
    <div>Top</div>
  </forge-split-view-panel>
  <forge-split-view-panel resizable="start" size="150" accessible-label="Bottom panel">
    <div>Bottom</div>
  </forge-split-view-panel>
</forge-split-view>
  </body>
</html>
