<!--
  @block Count Card — Slot Variations
  @type component
  @description Slot Variations usage example for the forge-count-card component.
  @tags count-card, slot-variations, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Count Card — Slot Variations</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-medium">
  <forge-count-card>
    <forge-icon slot="icon" name="attach_money"></forge-icon>
    <span slot="label">Revenue</span>
    <forge-badge slot="header-end" theme="success">+12%</forge-badge>
    <span slot="count">$12,450.00</span>
  </forge-count-card>

  <forge-count-card>
    <span slot="label">Total Users</span>
    <forge-menu slot="action">
      <forge-icon-button aria-label="More options">
        <forge-icon name="more_vert"></forge-icon>
      </forge-icon-button>
    </forge-menu>
    <span slot="count">1,234</span>
  </forge-count-card>

  <forge-count-card>
    <forge-icon slot="icon" name="shopping_cart"></forge-icon>
    <span slot="label">Orders This Month</span>
    <span slot="count">567</span>
    <span slot="count-end" class="text-medium">/ 1,000</span>
    <div slot="body">
      <forge-meter value="0.567" min="0" max="1" theme="info"></forge-meter>
    </div>
  </forge-count-card>

  <forge-count-card>
    <forge-icon slot="icon" name="trending_up"></forge-icon>
    <span slot="label">Year-over-Year Growth Rate for Q4 Performance Metrics</span>
    <span slot="count">+23.5%</span>
    <svg slot="full-width" viewBox="0 0 200 40" class="w-full block">
      <polyline
        fill="none"
        stroke="var(--forge-theme-success)"
        stroke-width="2"
        points="0,35 20,30 40,32 60,25 80,28 100,20 120,22 140,15 160,18 180,10 200,5" />
    </svg>
  </forge-count-card>
</div>
<script type="module" src="/blocks/v1/components/count-card/slot-variations/slot-variations.js"></script>
  </body>
</html>
