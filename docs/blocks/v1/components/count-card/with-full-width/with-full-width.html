<!--
  @block Count Card — With Full Width
  @type component
  @description With Full Width usage example for the forge-count-card component.
  @tags count-card, with-full-width, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Count Card — With Full Width</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div class="w-[320px]">
  <forge-count-card>
    <forge-icon slot="icon" name="trending_up"></forge-icon>
    <span slot="label">Weekly Sales</span>
    <span slot="count">$4,250.00</span>
    <svg slot="full-width" viewBox="0 0 200 40" class="w-full block">
      <polyline
        fill="none"
        stroke="var(--forge-theme-primary)"
        stroke-width="2"
        points="0,35 20,30 40,32 60,25 80,28 100,20 120,22 140,15 160,18 180,10 200,5" />
    </svg>
  </forge-count-card>
</div>
<script type="module" src="/blocks/v1/components/count-card/with-full-width/with-full-width.js"></script>
  </body>
</html>
