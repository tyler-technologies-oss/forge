<!--
  @block Count Card — Budget
  @type component
  @description Budget usage example for the forge-count-card component.
  @tags count-card, budget, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Count Card — Budget</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-medium">
  <forge-count-card>
    <forge-icon slot="icon" name="attach_money"></forge-icon>
    <span slot="label">Cost</span>
    <span slot="count">$33,002.00</span>
  </forge-count-card>

  <forge-count-card>
    <forge-icon slot="icon" name="account_balance"></forge-icon>
    <span slot="label">Funding</span>
    <span slot="count">$23,001.00</span>
  </forge-count-card>

  <forge-count-card theme="error">
    <forge-icon slot="icon" name="trending_down"></forge-icon>
    <span slot="label">Variance</span>
    <forge-badge slot="header-end" theme="error">Over budget</forge-badge>
    <span slot="count">-$10,001.00</span>
  </forge-count-card>

  <forge-count-card>
    <forge-icon slot="icon" name="star"></forge-icon>
    <span slot="label">Total score</span>
    <forge-icon-button slot="action" aria-label="Edit">
      <forge-icon name="edit"></forge-icon>
    </forge-icon-button>
    <span slot="count">Not scored</span>
  </forge-count-card>
</div>
<script type="module" src="/blocks/v1/components/count-card/budget/budget.js"></script>
  </body>
</html>
