<!--
  @block Button Area — As a Link
  @type component
  @description A button area wrapping an anchor so the whole card navigates when clicked.
  @tags button-area, as-a-link, anchor, link, navigation, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Button Area — As a Link</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-card class="p-0 w-[320px] max-w-full">
  <forge-button-area>
    <a slot="button" href="javascript: void(0);" aria-labelledby="button-area-link-heading"></a>
    <div class="flex items-center gap-xsmall p-medium">
      <div class="me-auto">
        <div class="text-heading3" id="button-area-link-heading">Page title</div>
        <div>Click anywhere to navigate.</div>
      </div>
      <forge-icon name="chevron_right"></forge-icon>
    </div>
  </forge-button-area>
</forge-card>
<script type="module" src="/blocks/v1/components/button-area/as-a-link/as-a-link.js"></script>
  </body>
</html>
