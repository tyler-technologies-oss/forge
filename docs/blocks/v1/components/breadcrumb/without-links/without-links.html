<!--
  @block Breadcrumb — Without Links
  @type component
  @description Breadcrumb whose items have no href, rendering as non-navigable text.
  @tags breadcrumb, without-links, overflow-menu, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Breadcrumb — Without Links</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-breadcrumb aria-label="Breadcrumb">
  <forge-breadcrumb-item home></forge-breadcrumb-item>
  <forge-breadcrumb-overflow-menu>
    <forge-breadcrumb-item>Section</forge-breadcrumb-item>
    <forge-breadcrumb-item>Subsection</forge-breadcrumb-item>
    <forge-breadcrumb-item>Category</forge-breadcrumb-item>
  </forge-breadcrumb-overflow-menu>
  <forge-breadcrumb-item>Parent</forge-breadcrumb-item>
  <forge-breadcrumb-item current>Current page</forge-breadcrumb-item>
</forge-breadcrumb>
  </body>
</html>
