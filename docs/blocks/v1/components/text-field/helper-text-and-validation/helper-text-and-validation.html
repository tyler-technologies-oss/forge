<!--
  @block Text Field — Helper Text And Validation
  @type component
  @description Helper Text And Validation usage example for the forge-text-field component.
  @tags text-field, helper-text-and-validation, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Text Field — Helper Text And Validation</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-text-field>
  <label slot="label">Email</label>
  <input type="email" />
  <span slot="support-text">We'll only use this to send a receipt.</span>
</forge-text-field>
<forge-text-field required>
  <label slot="label">Full name</label>
  <input type="text" />
</forge-text-field>
<forge-text-field invalid>
  <label slot="label">Email</label>
  <input type="email" value="not-an-email" />
  <span slot="support-text">Enter a valid email, like name@example.com.</span>
</forge-text-field>
  </body>
</html>
