  @block User Profile — Profile Link
  @type component
  @description Profile Link usage example for the forge-profile-link component.

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>User Profile — Profile Link</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-profile-link>
  <forge-icon slot="icon" name="history"></forge-icon>
  <a href="http://www.google.com" target="_blank">Audit log</a>
</forge-profile-link>
<forge-profile-link>
  <forge-icon slot="icon" name="settings" external></forge-icon>
  <a href="http://www.google.com" target="_blank">Application settings</a>
</forge-profile-link>
<forge-profile-link>
  <forge-icon slot="icon" name="account"></forge-icon>
  <a href="http://www.google.com" target="_blank">Profile</a>
</forge-profile-link>
<script type="module" src="/blocks/v1/components/user-profile/profile-link/profile-link.js"></script>
  </body>
</html>
