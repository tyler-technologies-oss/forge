<!--
  @block Banner — Themed
  @type component
  @description Themed usage example for the forge-banner component.
  @tags banner, themed, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Banner — Themed</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div style="display: flex; gap: 12px; flex-direction: column;">
  <forge-banner theme="error">Error</forge-banner>
  <forge-banner theme="warning">Warning</forge-banner>
  <forge-banner theme="success">Success</forge-banner>
  <forge-banner theme="info">Info (default)</forge-banner>
  <forge-banner theme="info-secondary">Info (secondary)</forge-banner>
</div>
  </body>
</html>
