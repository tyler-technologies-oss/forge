<!--
  @block Autocomplete — Infinite Scroll
  @type component
  @description Infinite Scroll usage example for the forge-autocomplete component.
  @tags autocomplete, infinite-scroll, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Autocomplete — Infinite Scroll</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <link rel="stylesheet" href="/blocks/v1/components/autocomplete/infinite-scroll/infinite-scroll.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-autocomplete observe-scroll>
  <forge-text-field popover-icon>
    <input
      type="text"
      id="state"
      autocomplete="off"
      role="combobox"
      aria-live="polite"
      aria-atomic="true"
      aria-haspopup="true"
      aria-expanded="false"
      aria-autocomplete="list"
      aria-controls="forge-aria-controls-placeholder" />
    <label for="state" aria-label="choose state" slot="label">Choose state</label>
  </forge-text-field>
</forge-autocomplete>
<script type="module" src="/blocks/v1/components/autocomplete/infinite-scroll/infinite-scroll.js"></script>
  </body>
</html>
