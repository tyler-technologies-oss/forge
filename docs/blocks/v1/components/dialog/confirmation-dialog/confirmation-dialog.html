<!--
  @block Dialog — Confirmation Dialog
  @type component
  @description Confirmation Dialog usage example for the forge-dialog component.
  @tags dialog, confirmation-dialog, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Dialog — Confirmation Dialog</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div>
  <forge-button id="open-confirmation-dialog-demo" variant="raised">Delete record</forge-button>
  <forge-confirmation-dialog id="confirmation-dialog-demo" label="Delete record?">
    <span slot="title">Delete record?</span>
    <span slot="message">This action can't be undone.</span>
    <span slot="secondary-button-text">Cancel</span>
    <span slot="primary-button-text">Delete</span>
  </forge-confirmation-dialog>
</div>
<script type="module" src="/blocks/v1/components/dialog/confirmation-dialog/confirmation-dialog.js"></script>
  </body>
</html>
