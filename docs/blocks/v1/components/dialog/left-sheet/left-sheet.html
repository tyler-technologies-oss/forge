<!--
  @block Dialog — Left Sheet
  @type component
  @description Left Sheet usage example for the forge-dialog component.
  @tags dialog, left-sheet, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Dialog — Left Sheet</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div>
  <forge-button id="open-dialog-button-left-sheet" variant="raised">Open dialog</forge-button>
  <forge-dialog id="dialog-left-sheet" preset="left-sheet">
    <forge-scaffold class="h-auto [--forge-scaffold-width:500px]">
      <forge-toolbar slot="header" no-divider>
        <h1 class="forge-typography--heading4 m-0" id="dialog-title-left-sheet" slot="start">Title text</h1>
        <forge-icon-button id="close-dialog-icon-button-left-sheet" slot="end" aria-label="Close dialog">
          <forge-icon name="close">
          </forge-icon>
        </forge-icon-button>
      </forge-toolbar>
      <p slot="body" id="dialog-message-left-sheet" class="p-medium">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Fugit sed pariatur error repellendus eos! Quas, optio esse ad illum quis blanditiis rerum quia.
        Corrupti, ad hic velit praesentium voluptatum dolores?
      </p>
      <forge-toolbar slot="footer" no-divider>
        <forge-button id="close-dialog-button-left-sheet" slot="end" variant="raised">Close</forge-button>
      </forge-toolbar>
    </forge-scaffold>
  </forge-dialog>
</div>
<script type="module" src="/blocks/v1/components/dialog/left-sheet/left-sheet.js"></script>
  </body>
</html>
