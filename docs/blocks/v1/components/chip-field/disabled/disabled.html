<!--
  @block Chip Field — Disabled
  @type component
  @description Disabled usage example for the forge-chip-field component.
  @tags chip-field, disabled, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Chip Field — Disabled</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-chip-field disabled>
  <label slot="label" for="chip-field-disabled-input">Tags</label>
  <input type="text" id="chip-field-disabled-input" />
  <forge-chip slot="member" type="field" dense disabled value="design">design</forge-chip>
  <forge-chip slot="member" type="field" dense disabled value="research">research</forge-chip>
</forge-chip-field>
  </body>
</html>
