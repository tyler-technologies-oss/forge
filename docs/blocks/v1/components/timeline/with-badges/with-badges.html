<!--
  @block Timeline — With Badges
  @type component
  @description Timeline items with a badge in the marker slot, themed to match each item's status.
  @tags timeline, with-badges, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Timeline — With Badges</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-timeline>
  <forge-timeline-item>
    <forge-badge slot="marker">New</forge-badge>
    <span>Feature Added</span>
  </forge-timeline-item>
  <forge-timeline-item theme="error">
    <forge-badge slot="marker" theme="error">Error</forge-badge>
    <span>Build Failed</span>
  </forge-timeline-item>
  <forge-timeline-item theme="success">
    <forge-badge slot="marker" theme="success">Done</forge-badge>
    <span>Tests Passed</span>
  </forge-timeline-item>
</forge-timeline>
  </body>
</html>
