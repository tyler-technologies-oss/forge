<!--
  @block Timeline — Themed
  @type component
  @description Timeline items using each marker theme: primary, success, warning, error, and info.
  @tags timeline, themed, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Timeline — Themed</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-timeline>
  <forge-timeline-item theme="primary">
    <span>Primary</span>
  </forge-timeline-item>
  <forge-timeline-item theme="success">
    <span>Success</span>
  </forge-timeline-item>
  <forge-timeline-item theme="warning">
    <span>Warning</span>
  </forge-timeline-item>
  <forge-timeline-item theme="error">
    <span>Error</span>
  </forge-timeline-item>
  <forge-timeline-item theme="info">
    <span>Info</span>
  </forge-timeline-item>
</forge-timeline>
  </body>
</html>
