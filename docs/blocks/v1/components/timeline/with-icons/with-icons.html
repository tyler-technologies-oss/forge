<!--
  @block Timeline — With Icons
  @type component
  @description Timeline items with an icon in the marker slot in place of the default circular marker.
  @tags timeline, with-icons, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Timeline — With Icons</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-timeline>
  <forge-timeline-item>
    <forge-icon slot="marker" name="check_circle"></forge-icon>
    <span>Feature deployment completed successfully</span>
  </forge-timeline-item>
  <forge-timeline-item>
    <forge-icon slot="marker" name="schedule"></forge-icon>
    <span>Scheduled maintenance at 3:00 PM</span>
  </forge-timeline-item>
  <forge-timeline-item>
    <forge-icon slot="marker" name="star"></forge-icon>
    <span>Product launch</span>
  </forge-timeline-item>
</forge-timeline>
<script type="module" src="/blocks/v1/components/timeline/with-icons/with-icons.js"></script>
  </body>
</html>
