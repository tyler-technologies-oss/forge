<!--
  @block Timeline — With Timestamps
  @type component
  @description Timestamps as date headings between timeline items, and as times before, after, or inside an item's detail.
  @tags timeline, with-timestamps, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Timeline — With Timestamps</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-timeline>
  <forge-timestamp datetime="2024-03-15"></forge-timestamp>
  <forge-timeline-item>
    <span>Timestamp after</span>
    <forge-timestamp datetime="2024-03-15T14:30:00" format="HH:mm" separator="start"></forge-timestamp>
  </forge-timeline-item>
  <forge-timeline-item>
    <forge-timestamp datetime="2024-03-15T12:15:00" format="HH:mm" separator="end"></forge-timestamp>
    <span>Timestamp before</span>
  </forge-timeline-item>
  <forge-timestamp datetime="2024-03-14"></forge-timestamp>
  <forge-timeline-item>
    <span>No timestamp separator</span>
    <forge-timestamp datetime="2024-03-14T16:45:00" format="HH:mm"></forge-timestamp>
  </forge-timeline-item>
  <forge-timeline-item>
    <span>Timestamp in detail</span>
    <div slot="detail">Posted at <forge-timestamp datetime="2024-03-14T16:45:00" format="HH:mm"></forge-timestamp></div>
  </forge-timeline-item>
</forge-timeline>
  </body>
</html>
