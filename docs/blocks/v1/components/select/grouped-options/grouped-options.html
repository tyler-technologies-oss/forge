<!--
  @block Select — Grouped Options
  @type component
  @description Grouped Options usage example for the forge-select component.
  @tags select, grouped-options, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Select — Grouped Options</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-select label="Food group" aria-label="Food group">
  <forge-option-group label="Produce">
    <forge-option value="fruit">Fruit</forge-option>
    <forge-option value="vegetables">Vegetables</forge-option>
  </forge-option-group>
  <forge-option-group label="Grains">
    <forge-option value="bread">Bread</forge-option>
    <forge-option value="rice">Rice</forge-option>
  </forge-option-group>
</forge-select>
  </body>
</html>
