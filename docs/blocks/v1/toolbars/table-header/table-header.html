<!--
  @block Card Header Toolbar with Actions
  @type pattern
  @description Card header toolbar with the card title in the start slot and medium-density icon buttons for filter, export, and more options grouped in the end slot
  @tags toolbar, header, card, table, actions
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/v1/" />
    <title>Card Header Toolbar with Actions</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/v1/theme.css" />
    <link rel="stylesheet" href="/blocks/v1/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/v1/forge-register.js"></script>
    <script type="module" src="/blocks/v1/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/v1/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/v1/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-card no-padding class="max-w-md">
  <forge-scaffold>
    <forge-toolbar slot="header">
      <h2 slot="start" class="text-heading3">Card title</h2>
      <div slot="end" class="flex items-center gap-xsmall">
        <forge-icon-button density="medium" aria-label="Filter">
          <forge-icon name="filter_list"></forge-icon>
        </forge-icon-button>
        <forge-icon-button density="medium" aria-label="Export">
          <forge-icon name="download"></forge-icon>
        </forge-icon-button>
        <forge-icon-button density="medium" aria-label="More options">
          <forge-icon name="more_vert"></forge-icon>
        </forge-icon-button>
      </div>
    </forge-toolbar>
    <div slot="body" class="p-medium">
      <div class="striped-box min-h-24"></div>
    </div>
  </forge-scaffold>
</forge-card>
  </body>
</html>
