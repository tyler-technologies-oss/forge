<!--
  @block Toolbar with Button Actions
  @type pattern
  @description Toolbar component with a title and action buttons in the end slot, featuring a text button, tonal button, and raised primary button for common form or dialog actions
  @tags toolbar, buttons, actions, form
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1205/" />
    <title>Toolbar with Button Actions</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1205/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1205/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1205/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/pr-1205/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-toolbar>
  <h2 slot="start" class="text-heading3">Title</h2>
  <div slot="end" class="flex gap-small">
    <forge-button>Cancel</forge-button>
    <forge-button variant="tonal">Save Draft</forge-button>
    <forge-button variant="raised">Submit</forge-button>
  </div>
</forge-toolbar>

  </body>
</html>
