<!--
  @block App Bar — Custom Theme
  @type component
  @description Custom Theme usage example for the forge-app-bar component.
  @tags app-bar, custom-theme, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1205/" />
    <title>App Bar — Custom Theme</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1205/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1205/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1205/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/pr-1205/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-app-bar class="[--forge-app-bar-background:salmon] [--forge-app-bar-foreground:black]" title-text="Tyler Forge™" theme-mode="scoped" elevation="raised">
  <forge-icon slot="logo" name="forge_logo">
  </forge-icon>
  <forge-button slot="end" theme="app-bar" class="me-xsmall">Sign In</forge-button>
</forge-app-bar>
<script type="module" src="/blocks/pr-1205/components/app-bar/custom-theme/custom-theme.js"></script>
  </body>
</html>
