<!--
  @block Listbox — Reorderable
  @type component
  @description A listbox whose options can be reordered with drag and drop.
  @tags listbox, reorderable, drag-and-drop, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1205/" />
    <title>Listbox — Reorderable</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1205/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1205/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1205/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/pr-1205/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-listbox class="max-w-[500px]" reorderable>
  <forge-option value="1">Option 1</forge-option>
  <forge-option value="2">Option 2</forge-option>
  <forge-option value="3">Option 3</forge-option>
</forge-listbox>
<script type="module" src="/blocks/pr-1205/components/listbox/reorderable/reorderable.js"></script>
  </body>
</html>
