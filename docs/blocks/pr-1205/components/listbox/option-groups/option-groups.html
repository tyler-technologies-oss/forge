<!--
  @block Listbox — Option Groups
  @type component
  @description A listbox with options organized into labeled groups.
  @tags listbox, option-group, groups, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1205/" />
    <title>Listbox — Option Groups</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1205/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1205/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1205/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/pr-1205/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-listbox class="max-w-[500px]">
  <forge-option-group>
    <div slot="label">Fruits</div>
    <forge-option value="apple">Apple</forge-option>
    <forge-option value="banana">Banana</forge-option>
    <forge-option value="orange">Orange</forge-option>
  </forge-option-group>
  <forge-option-group>
    <div slot="label">Vegetables</div>
    <forge-option value="carrot">Carrot</forge-option>
    <forge-option value="lettuce">Lettuce</forge-option>
    <forge-option value="tomato">Tomato</forge-option>
  </forge-option-group>
</forge-listbox>
  </body>
</html>
