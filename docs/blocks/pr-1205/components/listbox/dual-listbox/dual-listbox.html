<!--
  @block Listbox — Dual Listbox
  @type component
  @description Two linked listboxes that let options be dragged and dropped between them.
  @tags listbox, dual-listbox, drag-and-drop, drag-link, drop-link, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1205/" />
    <title>Listbox — Dual Listbox</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1205/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1205/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1205/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/pr-1205/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div class="grid grid-cols-2 gap-medium">
  <forge-card class="p-0">
    <forge-listbox class="min-h-[48px]" id="dual-listbox-1" drag-link="dual-listbox-2" drop-link="dual-listbox-2">
      <forge-option value="1">Option 1</forge-option>
      <forge-option value="2">Option 2</forge-option>
      <forge-option value="3">Option 3</forge-option>
    </forge-listbox>
  </forge-card>
  <forge-card class="p-0">
    <forge-listbox class="min-h-[48px]" id="dual-listbox-2" drag-link="dual-listbox-1" drop-link="dual-listbox-1">
      <forge-option value="a">Option A</forge-option>
      <forge-option value="b">Option B</forge-option>
      <forge-option value="c">Option C</forge-option>
      <forge-option-group>
        <div slot="label">Group 1</div>
        <forge-option value="x">Option D</forge-option>
        <forge-option value="y">Option E</forge-option>
      </forge-option-group>
    </forge-listbox>
  </forge-card>
</div>
<script type="module" src="/blocks/pr-1205/components/listbox/dual-listbox/dual-listbox.js"></script>
  </body>
</html>
