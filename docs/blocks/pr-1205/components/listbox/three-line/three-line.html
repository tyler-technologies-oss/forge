<!--
  @block Listbox — Three Line
  @type component
  @description A listbox with options that display secondary and tertiary text.
  @tags listbox, three-line, secondary-text, tertiary-text, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1205/" />
    <title>Listbox — Three Line</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1205/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1205/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1205/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/pr-1205/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-listbox class="max-w-[500px]">
  <forge-option value="1" three-line>
    <span>Option 1</span>
    <span slot="secondary">Secondary text for option 1</span>
    <span slot="tertiary">Tertiary text for option 1</span>
  </forge-option>
  <forge-option value="2" three-line>
    <span>Option 2</span>
    <span slot="secondary">Secondary text for option 2</span>
    <span slot="tertiary">Tertiary text for option 2</span>
  </forge-option>
  <forge-option value="3" three-line>
    <span>Option 3</span>
    <span slot="secondary">Secondary text for option 3</span>
    <span slot="tertiary">Tertiary text for option 3</span>
  </forge-option>
</forge-listbox>
  </body>
</html>
