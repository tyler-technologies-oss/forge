<!--
  @block Listbox — Leading Icons
  @type component
  @description A listbox whose options each display a leading icon.
  @tags listbox, icons, leading-icon, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1205/" />
    <title>Listbox — Leading Icons</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1205/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1205/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1205/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/pr-1205/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-listbox class="max-w-[500px]">
  <forge-option value="home">
    <forge-icon name="home" external slot="start"></forge-icon>
    Home
  </forge-option>
  <forge-option value="settings">
    <forge-icon name="settings" external slot="start"></forge-icon>
    Settings
  </forge-option>
  <forge-option value="profile">
    <forge-icon name="person" external slot="start"></forge-icon>
    Profile
  </forge-option>
</forge-listbox>
  </body>
</html>
