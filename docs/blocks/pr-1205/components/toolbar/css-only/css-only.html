<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1205/" />
    <title>Toolbar — CSS Only</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/styles.css" />
    <link rel="stylesheet" href="/blocks/pr-1205/components/toolbar/css-only/css-only.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1205/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1205/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1205/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/pr-1205/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <div class="forge-toolbar">
  <div class="forge-toolbar__start flex flex-col justify-center items-center w-full py-xsmall my-xxsmall border-2 border-dashed border-outline">Start</div>
  <div class="forge-toolbar__center flex flex-col justify-center items-center w-full py-xsmall my-xxsmall border-2 border-dashed border-outline">Center</div>
  <div class="forge-toolbar__end flex flex-col justify-center items-center w-full py-xsmall my-xxsmall border-2 border-dashed border-outline">End</div>
</div>

</html>
