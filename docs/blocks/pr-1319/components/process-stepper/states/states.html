<!--
  @block Process Stepper — States
  @type component
  @description Process stepper showing every step state, with support text on the not-started and critical steps.
  @tags process-stepper, states, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1319/" />
    <title>Process Stepper — States</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1319/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1319/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1319/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1319/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1319/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/pr-1319/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-process-stepper>
  <forge-process-step state="current">Current</forge-process-step>
  <forge-process-step state="completed">Completed</forge-process-step>
  <forge-process-step state="in-progress">In progress</forge-process-step>
  <forge-process-step state="not-started">
    Not started
    <span slot="support-text">Optional</span>
  </forge-process-step>
  <forge-process-step state="critical">
    Critical
    <span slot="support-text">Error</span>
  </forge-process-step>
</forge-process-stepper>
  </body>
</html>
