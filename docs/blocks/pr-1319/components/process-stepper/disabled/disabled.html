<!--
  @block Process Stepper — Disabled
  @type component
  @description Horizontal process stepper with upcoming steps disabled to prevent interaction.
  @tags process-stepper, disabled, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1319/" />
    <title>Process Stepper — Disabled</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1319/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1319/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1319/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1319/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1319/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/pr-1319/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <forge-process-stepper orientation="horizontal">
  <forge-process-step state="completed">Cart</forge-process-step>
  <forge-process-step state="current">Shipping</forge-process-step>
  <forge-process-step disabled>Payment</forge-process-step>
  <forge-process-step disabled>Review</forge-process-step>
</forge-process-stepper>
  </body>
</html>
