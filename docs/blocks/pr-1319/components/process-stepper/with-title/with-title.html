<!--
  @block Process Stepper — With Title
  @type component
  @description Horizontal process stepper labelled by a visible heading via aria-labelledby.
  @tags process-stepper, with-title, storybook, component-example
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/blocks/pr-1319/" />
    <title>Process Stepper — With Title</title>
    <link rel="stylesheet" href="https://cdn.forge.tylertech.com/v1/css/tyler-font.css" />
    <link rel="stylesheet" href="/blocks/pr-1319/theme.css" />
    <link rel="stylesheet" href="/blocks/pr-1319/styles.css" />
    <style>
      body {
        opacity: 0;
        transition: opacity 0.2s ease-in;
      }
      body.ready {
        opacity: 1;
      }
    </style>
    <script type="module" src="/blocks/pr-1319/forge-register.js"></script>
    <script type="module" src="/blocks/pr-1319/ready-transition.js" id="ready-transition"></script>
    <script type="module" src="/blocks/pr-1319/theme-listener.js" id="theme-listener"></script>
    <script type="module" src="/blocks/pr-1319/height-reporter.js" id="height-reporter"></script>
  </head>
  <body class=" overflow-y-auto overflow-x-hidden" style="background-color: transparent">
    <h2 id="record-progress-title" class="text-subheading1 mb-small">Record progress</h2>
<forge-process-stepper orientation="horizontal" aria-labelledby="record-progress-title">
  <forge-process-step state="completed">Application received</forge-process-step>
  <forge-process-step state="completed">Fees paid</forge-process-step>
  <forge-process-step state="completed">Internal review</forge-process-step>
  <forge-process-step state="current">Documents approved</forge-process-step>
  <forge-process-step>Record issued</forge-process-step>
</forge-process-stepper>
  </body>
</html>
