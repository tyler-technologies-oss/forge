    <radialGradient id="grid-fade" cx="0.5" cy="0.5" r="0.7">
      <stop offset="0.2" stop-color="#fff" stop-opacity="1" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </radialGradient>
    <mask id="grid-mask">
      <rect width="1920" height="1080" fill="url(#grid-fade)" />
