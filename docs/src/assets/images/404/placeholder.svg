<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1437" />
      <stop offset="0.55" stop-color="#14286b" />
      <stop offset="1" stop-color="#0a1a4a" />
    </linearGradient>
    <radialGradient id="glow-a" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f8cff" stop-opacity="0.85" />
      <stop offset="1" stop-color="#4f8cff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-b" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9b6bff" stop-opacity="0.7" />
      <stop offset="1" stop-color="#9b6bff" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glow-c" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2ee6d6" stop-opacity="0.55" />
      <stop offset="1" stop-color="#2ee6d6" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1" />
