  <ellipse cx="1180" cy="940" rx="820" ry="420" fill="url(#glow-c)" />

  <rect width="1920" height="1080" fill="url(#grid)" mask="url(#grid-mask)" />

  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M-40 760C260 620 520 880 860 740S1440 560 1960 700" stroke-opacity="0.16" stroke-width="1.5" />
    <path d="M-40 820C300 690 560 940 900 800S1460 630 1960 770" stroke-opacity="0.1" stroke-width="1.5" />
    <path d="M-40 880C340 760 600 1000 940 860S1480 700 1960 840" stroke-opacity="0.06" stroke-width="1.5" />
  </g>

